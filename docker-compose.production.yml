services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitch_bingo
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bingo -d twitch_bingo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bingo:${POSTGRES_PASSWORD}@postgres:5432/twitch_bingo?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bingo-api.rule=Host(`bingo.landminentester.de`) && PathPrefix(`/api`)
      - traefik.http.services.bingo-api.loadbalancer.server.port=3000
    networks: [traefik, internal]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.bingo-web.rule=Host(`bingo.landminentester.de`)
      - traefik.http.services.bingo-web.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [traefik]
networks:
  traefik: { external: true }
  internal: { internal: true }
volumes:
  postgres_data:
