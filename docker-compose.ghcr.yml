version: "3.8"

services:
  bingo-postgres:
    image: postgres:17-alpine
    container_name: bingo-postgres
    restart: always
    environment:
      - POSTGRES_DB=twitch_bingo
      - POSTGRES_USER=bingo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - bingo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d twitch_bingo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bingo_internal

  bingo-api:
    image: ghcr.io/landminentester/bingo-api:latest
    container_name: bingo-api
    restart: always
    depends_on:
      bingo-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://bingo:${POSTGRES_PASSWORD}@bingo-postgres:5432/twitch_bingo?schema=public
      - NODE_ENV=production
      - API_PORT=3000
      - WEB_ORIGIN=${WEB_ORIGIN}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_REDIRECT_URI=${TWITCH_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - traefik
      - bingo_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.bingo-api.rule=Host(`bingo.landminentester.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.bingo-api.entrypoints=websecure"
      - "traefik.http.routers.bingo-api.tls=true"
      - "traefik.http.routers.bingo-api.tls.certresolver=myresolver"
      - "traefik.http.services.bingo-api.loadbalancer.server.port=3000"

  bingo-web:
    image: ghcr.io/landminentester/bingo-web:latest
    container_name: bingo-web
    restart: always
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.bingo-web.rule=Host(`bingo.landminentester.de`)"
      - "traefik.http.routers.bingo-web.entrypoints=websecure"
      - "traefik.http.routers.bingo-web.tls=true"
      - "traefik.http.routers.bingo-web.tls.certresolver=myresolver"
      - "traefik.http.services.bingo-web.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  traefik:
    external: true
  bingo_internal:

volumes:
  bingo_postgres_data:
